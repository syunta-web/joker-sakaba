<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>ジョーカー酒場</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=DotGothic16&display=swap">
<style id="css">
/* Layout: smoky card-bar table. Ledger sidebar on the left, churning pixel felt stage on the right. Deliberately single dark look. */
:root{
  color-scheme: dark;
  --felt:#17403a; --felt-deep:#0c2421; --wine:#3a1630;
  --panel:#1a1621; --panel-2:#262030; --line:#40364b;
  --ink:#f3ead8; --muted:#a99fb4;
  --chips:#2d86e8; --mult:#e8473a; --gold:#f4b43a; --ok:#4fbf7a;
  --card:#f7f1e3; --card-ink:#26222c;
  --heart:#d6332a; --club:#1f63b0; --diamond:#dd7410; --spade:#2a2533;
  --r1:#3d8fd9; --r2:#3fae6e; --r3:#d8463c; --r4:#e070ff;
  --tarot:#a274e0; --planet:#2fb3b3; --pack:#e08a3a; --vch:#e0609a; --spectral:#b8c6ff;
  --k-m1:#6b2a30; --k-m2:#2a1620; --k-mc:#ff8a7e;
  --k-c1:#254a80; --k-c2:#181a30; --k-cc:#7dbaff;
  --k-x1:#6e5318; --k-x2:#2a1c18; --k-xc:#ffd067;
  --k-d1:#56581f; --k-d2:#1f2416; --k-dc:#f4e06a;
  --k-r1:#4f3179; --k-r2:#1d1630; --k-rc:#cfa6ff;
  --k-u1:#1f5547; --k-u2:#151f24; --k-uc:#7fe0ae;
  --f-disp:'Dela Gothic One','DotGothic16','Yu Gothic',system-ui,sans-serif;
  --f-body:'DotGothic16','Hiragino Kaku Gothic ProN','Yu Gothic',monospace;
  --cw:clamp(46px,6.6vw,84px);
  --jw:calc(var(--cw)*.98);
}
html,body{height:100%}
body{background:var(--felt-deep);color:var(--ink);font-family:var(--f-body);font-size:14px;overflow-x:hidden;-webkit-tap-highlight-color:transparent}
#bg{position:fixed;inset:0;width:100%;height:100%;image-rendering:pixelated;z-index:0;opacity:.9}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation}
button:focus-visible,.card:focus-visible,.jk:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
button:disabled{opacity:.4;cursor:not-allowed}

#app{position:relative;z-index:1;display:grid;grid-template-columns:250px minmax(0,1fr);gap:14px;padding-block:14px;padding-inline:16px;max-width:1280px;margin:0 auto;min-height:100%;box-sizing:border-box}
#side{display:flex;flex-direction:column;gap:8px;background:rgba(22,18,28,.88);border:2px solid var(--line);border-radius:12px;padding:10px;align-self:start;position:sticky;top:14px;box-shadow:0 6px 0 rgba(0,0,0,.35)}
.blk{background:var(--panel-2);border-radius:8px;padding:8px 10px;min-width:0}
.lbl{display:block;font-size:11px;color:var(--muted);letter-spacing:.08em}
.blind{background:var(--wine);border:2px solid rgba(255,255,255,.08)}
.blind .bn{font-family:var(--f-disp);font-size:18px;line-height:1.2}
.blind .bd{font-size:12px;color:#e9c9da;margin-top:2px;min-height:1em}
.blind .bt{display:flex;justify-content:space-between;align-items:baseline;margin-top:6px;gap:8px}
.blind .bt b{font-family:var(--f-disp);font-size:20px;color:var(--mult)}
.blind .rw{color:var(--gold);font-size:13px}
.scoreblk b{font-family:var(--f-disp);font-size:24px;font-variant-numeric:tabular-nums;display:block}
.bar{height:6px;background:rgba(0,0,0,.4);border-radius:3px;overflow:hidden;margin-top:4px}
.bar i{display:block;height:100%;width:0;background:var(--gold);transition:width .3s}
.handblk{text-align:center}
#handName{font-size:15px;min-height:1.3em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#handName small{color:var(--muted);font-size:12px;margin-left:4px}
.cxm{display:flex;align-items:center;gap:6px;margin-top:6px;position:relative}
.handblk{position:relative;isolation:isolate}
#fire{position:absolute;left:0;top:-34px;width:100%;height:calc(34px + 55%);image-rendering:pixelated;z-index:-1;pointer-events:none}
.cxm.fire .chips{box-shadow:0 0 0 2px #cfe6ff,0 0 14px #6fb1ff}
.cxm.fire .mult{box-shadow:0 0 0 2px #ffe0a8,0 0 14px #ff8a3a}
.cxm.fire .x{color:var(--gold)}
.handblk:has(.cxm.fire) #handName{text-shadow:0 1px 0 #000,0 0 5px #000,0 0 5px #000}
.cxm span{flex:1;min-width:0;font-family:var(--f-disp);font-size:20px;border-radius:6px;padding:4px 6px;font-variant-numeric:tabular-nums;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cxm .chips{background:var(--chips);text-align:right}
.cxm .mult{background:var(--mult);text-align:left}
.cxm .x{flex:none;font-size:18px;color:var(--mult);padding:0}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.stat b{font-family:var(--f-disp);font-size:20px;font-variant-numeric:tabular-nums}
.c-chips{color:#6fb1ff}.c-mult{color:#ff7a6e}.c-gold{color:var(--gold)}
.stat.money{grid-column:1/-1;display:flex;justify-content:space-between;align-items:center}
.stat.money b{font-size:24px;color:var(--gold)}
.tools{display:grid;grid-template-columns:1fr 1fr;gap:6px;padding:0;background:none}
.tools button{background:var(--panel);border:2px solid var(--line);border-radius:6px;padding:6px 4px;font-size:12px}
.tools button:hover{border-color:var(--muted)}
.bump{animation:bump .22s}
@keyframes bump{50%{transform:scale(1.12)}}

#main{display:flex;flex-direction:column;gap:12px;min-width:0}
#topRow{display:flex;gap:10px;align-items:stretch;min-width:0}
.slots{background:rgba(10,8,14,.55);border:2px dashed rgba(255,255,255,.12);border-radius:10px;padding:6px 8px 8px;min-width:0}
.slots.jkr{flex:1}
.slots.cns{flex:0 1 calc(var(--jw)*2 + 28px)}
.slotHead{font-size:11px;color:var(--muted);margin-bottom:5px;letter-spacing:.06em}
.tiles{display:flex;gap:6px;min-width:0}
.jk{position:relative;flex:0 1 var(--jw);min-width:0;aspect-ratio:5/7;background:var(--panel-2);border:2px solid var(--rc,var(--line));border-radius:8px;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:5px 3px;cursor:pointer;box-shadow:0 4px 0 rgba(0,0,0,.4);text-align:center;overflow:hidden;box-sizing:border-box}
.jk.empty{background:none;border:2px dashed rgba(255,255,255,.1);box-shadow:none;cursor:default}
.jk .gl{font-family:var(--f-disp);font-size:calc(var(--jw)*.42);line-height:1;color:var(--rc);margin-top:8%}
.jk .jn{font-size:clamp(9px,calc(var(--jw)*.13),12px);line-height:1.15;word-break:break-all}
.jk .jv{position:absolute;top:2px;right:3px;font-size:10px;color:var(--gold)}
.jk.r1{--rc:var(--r1)}.jk.r2{--rc:var(--r2)}.jk.r3{--rc:var(--r3)}.jk.r4{--rc:var(--r4);box-shadow:0 4px 0 rgba(0,0,0,.4),0 0 10px var(--r4)}
.jk.tarot{--rc:var(--tarot)}.jk.spectral{--rc:var(--spectral)}.jk.planet{--rc:var(--planet)}.jk.packk{--rc:var(--pack)}
.k-m{--k1:var(--k-m1);--k2:var(--k-m2);--kc:var(--k-mc)}.k-c{--k1:var(--k-c1);--k2:var(--k-c2);--kc:var(--k-cc)}
.k-x{--k1:var(--k-x1);--k2:var(--k-x2);--kc:var(--k-xc)}.k-d{--k1:var(--k-d1);--k2:var(--k-d2);--kc:var(--k-dc)}
.k-r{--k1:var(--k-r1);--k2:var(--k-r2);--kc:var(--k-rc)}.k-u{--k1:var(--k-u1);--k2:var(--k-u2);--kc:var(--k-uc)}
.jk[data-ji]{background:var(--k1);justify-content:flex-end;gap:3%}
.jk[data-ji]::before{content:'';position:absolute;inset:3px;border:1px solid rgba(0,0,0,.22);border-radius:5px;pointer-events:none}
.jk .gl.art{font-size:calc(var(--jw)*.56);font-size:max(20px,round(down,calc(var(--jw)*.62),20px));margin-top:0;color:var(--ink);}
.jk .ix{position:absolute;top:2px;left:4px;font-family:var(--f-disp);font-size:clamp(10px,calc(var(--jw)*.19),15px);line-height:1;color:var(--kc)}
.jk[data-ji] .jn{position:relative;z-index:1;width:100%;background:rgba(0,0,0,.42);border-radius:4px;padding:2px 1px;box-sizing:border-box}
.jk[data-ji] .jv{color:var(--kc);background:rgba(0,0,0,.45);border-radius:3px;padding:0 3px;top:3px;right:4px;z-index:1}
.jhead{display:flex;align-items:center;gap:8px;border-radius:8px;padding:6px 8px;background:var(--k1)}
.jhead .ia{font-size:40px;line-height:1}
.jhead.pk{background:rgba(0,0,0,.28);justify-content:center}
.jhead.pk .ia{font-size:60px}
.ptitle.pkt .px{display:inline-block;font-size:40px;vertical-align:-11px;margin-right:8px}
.bl .tag.wi{display:flex;align-items:center;gap:8px;text-align:left}
.bl .tag.wi .px{flex:none;font-size:40px}
.bchip{width:60px;height:60px;margin:0 auto;font-size:60px;line-height:1}
.blind .bn .px,table.ht .px{display:inline-block;font-size:20px;vertical-align:-4px;margin-right:6px}
.kchip{font-size:11px;color:var(--kc);border:1px solid var(--kc);border-radius:99px;padding:1px 7px;white-space:nowrap}
.px{display:block;width:1em;height:1em;image-rendering:pixelated;max-width:none}
#pop h4 .emo .px{display:inline-block;font-size:20px;vertical-align:-4px}
.jk:hover:not(.empty){transform:translateY(-3px)}
#jokers .jk[data-ji]{transform:translateX(var(--dx,0px));touch-action:none;cursor:grab;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;transition:transform .13s}
#jokers .jk[data-ji] img{pointer-events:none;-webkit-user-drag:none;-webkit-touch-callout:none}
#jokers .jk[data-ji]:hover{transform:translate(var(--dx,0px),-3px)}
#jokers .jk[data-ji].pick{outline:3px solid var(--gold);outline-offset:1px}
#jokers .jk[data-ji].drag{z-index:5;cursor:grabbing;outline:3px solid var(--gold);outline-offset:1px;transition:none;transform:translate(var(--dx,0px),var(--lift,-8%)) scale(1.14);box-shadow:0 12px 0 rgba(0,0,0,.3),0 0 14px rgba(244,180,58,.45)}
.jig{animation:jig .28s}
@keyframes jig{25%{transform:rotate(-7deg) scale(1.08)}75%{transform:rotate(6deg) scale(1.08)}}

#stage{flex:1;display:flex;flex-direction:column;gap:12px;min-width:0;min-height:calc(var(--cw)*3.6)}
.cardrow{display:flex;justify-content:center;align-items:flex-end;min-height:calc(var(--cw)*1.4 + 26px);padding-top:22px;min-width:0}
#playArea{border-radius:12px;background:rgba(0,0,0,.14)}
#handArea{padding-top:30px}
.card{position:relative;width:var(--cw);height:calc(var(--cw)*1.4);flex:none;background:var(--card);border-radius:calc(var(--cw)*.09);color:var(--card-ink);box-shadow:0 4px 0 rgba(0,0,0,.4),inset 0 0 0 2px rgba(0,0,0,.08);transition:transform .14s;cursor:pointer;user-select:none;font-family:var(--f-disp);box-sizing:border-box}
.card .cr{position:absolute;left:7%;top:4%;font-size:calc(var(--cw)*.23);line-height:1;display:flex;flex-direction:column;align-items:center}
.card .cr i{font-style:normal;font-size:.75em}
.card .cr.br{left:auto;top:auto;right:7%;bottom:4%;transform:rotate(180deg)}
.card .cs{position:absolute;inset:0;display:grid;place-items:center;font-size:calc(var(--cw)*.5)}
.card .cs.face{font-size:calc(var(--cw)*.44)}
.card.s-H{color:var(--heart)}.card.s-D{color:var(--diamond)}.card.s-C{color:var(--club)}.card.s-S{color:var(--spade)}
.card.sel{transform:translateY(-24%)}
.card.scoring{transform:translateY(-16%)}
.card.dim{filter:brightness(.6)}
#handArea .card{transform:translateX(var(--dx,0px));touch-action:pan-y;cursor:grab}
#handArea .card.sel{transform:translate(var(--dx,0px),-24%)}
#handArea .card.drag{transition:none;z-index:5;cursor:grabbing;box-shadow:0 12px 0 rgba(0,0,0,.3),inset 0 0 0 2px rgba(0,0,0,.08),0 0 0 3px var(--gold)}
.card .tg{position:absolute;bottom:6%;left:50%;transform:translateX(-50%);font-family:var(--f-body);font-size:max(9px,calc(var(--cw)*.13));background:rgba(20,16,26,.82);color:#fff;padding:0 4px;border-radius:3px;white-space:nowrap}
.card .bon{position:absolute;top:4%;right:7%;font-family:var(--f-body);font-size:max(9px,calc(var(--cw)*.13));color:var(--chips)}
.card.e-bonus{background:#d8e8fc}
.card.e-mult{background:#fadcd6}
.card.e-glass{background:linear-gradient(135deg,rgba(235,248,255,.95),rgba(190,220,240,.75) 50%,rgba(235,248,255,.95));box-shadow:0 4px 0 rgba(0,0,0,.4),inset 0 0 0 2px rgba(120,170,210,.6)}
.card.e-steel{background:linear-gradient(160deg,#e3e6eb,#a9b0bb 55%,#d6dae0)}
.card.e-gold{background:linear-gradient(160deg,#ffe79a,#e2b345 60%,#fbe08a)}
.card.e-lucky{background:#dcf1d2}
.card.e-wild{background:conic-gradient(from 30deg,#fde2e0,#fdf1d0,#dcf3dc,#d9e9fc,#ecdcf9,#fde2e0)}
.card.dbf::after{content:'';position:absolute;inset:0;border-radius:inherit;background:repeating-linear-gradient(45deg,rgba(232,71,58,.4) 0 6px,transparent 6px 12px)}

.actions{display:flex;gap:10px;justify-content:center;align-items:center;flex-wrap:wrap}
.btn{font-family:var(--f-disp);font-size:16px;border:none;border-radius:8px;padding:12px 20px;box-shadow:0 4px 0 rgba(0,0,0,.45);color:#fff}
.btn:active:not(:disabled){transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.45)}
.btn.blue{background:var(--chips)}.btn.red{background:var(--mult)}.btn.gold{background:var(--gold);color:#2a1d05}.btn.green{background:var(--ok)}.btn.dark{background:var(--panel-2);border:2px solid var(--line)}
.btn.small{font-size:13px;padding:8px 12px}
.sortbox{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;color:var(--muted)}
.sortbox div{display:flex;gap:4px}
.sortbox button{background:var(--panel);border:2px solid var(--line);border-radius:6px;padding:4px 10px;font-size:12px}
.sortbox button.on{border-color:var(--gold);color:var(--gold)}
.hint{text-align:center;font-size:12px;color:var(--muted);min-height:1.2em}

.panel{background:rgba(22,18,28,.92);border:2px solid var(--line);border-radius:12px;padding:14px;box-shadow:0 6px 0 rgba(0,0,0,.35)}
.ptitle{font-family:var(--f-disp);font-size:22px;margin:0 0 10px;text-wrap:balance}
.blinds{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.bl{display:flex;flex-direction:column;gap:8px;align-items:stretch;text-align:center;padding:12px 10px}
.bl.cur{border-color:var(--gold)}
.bl.past{opacity:.55}
.bl .chip{width:54px;height:54px;border-radius:50%;margin:0 auto;display:grid;place-items:center;font-family:var(--f-disp);font-size:13px;border:4px dashed rgba(255,255,255,.35)}
.bl .need{font-family:var(--f-disp);font-size:22px;color:var(--mult)}
.bl .desc{font-size:12px;color:var(--muted);min-height:2.4em}
.bl .tag{font-size:12px;background:var(--panel-2);border-radius:6px;padding:6px}
.bl .tag b{color:var(--gold)}
.bl .act{display:flex;flex-direction:column;gap:6px;align-items:stretch}
.bl .state{font-family:var(--f-disp);font-size:14px;color:var(--muted)}

.cash{max-width:460px;margin:0 auto;width:100%;box-sizing:border-box}
.cash .row{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-bottom:1px dotted var(--line)}
.cash .row b{color:var(--gold);font-variant-numeric:tabular-nums}
.cash .btn{width:100%;margin-top:14px}

.shophead{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin-bottom:12px}
.shophead .ptitle{margin:0;color:var(--gold)}
.shophead .grp{display:flex;gap:8px;flex-wrap:wrap}
.shopgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.item{background:var(--panel-2);border:2px solid var(--rc,var(--line));border-radius:10px;padding:10px;display:flex;flex-direction:column;gap:6px;min-width:0}
.item.r1{--rc:var(--r1)}.item.r2{--rc:var(--r2)}.item.r3{--rc:var(--r3)}.item.r4{--rc:var(--r4);box-shadow:0 0 10px var(--r4)}.item.tarot{--rc:var(--tarot)}.item.spectral{--rc:var(--spectral)}.item.planet{--rc:var(--planet)}.item.packk{--rc:var(--pack)}.item.vch{--rc:var(--vch)}
.item .kind{font-size:11px;color:var(--rc);letter-spacing:.06em}
.item .nm{font-family:var(--f-disp);font-size:15px;line-height:1.25}
.item .ds{font-size:12px;color:#d9d0e2;flex:1;line-height:1.45}
.item .btn{padding:8px 10px;font-size:14px}
.item.sold{opacity:.35}
.item .mini{display:flex;justify-content:center;gap:4px;flex-wrap:wrap;--cw:44px}
.sub{font-size:12px;color:var(--muted);margin:14px 0 8px;letter-spacing:.08em}

.botRow{display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap}
.botRow button{background:var(--panel);border:2px solid var(--line);border-radius:8px;padding:6px 12px;font-size:12px}
.botRow b{color:var(--gold)}
#vchBtn b{color:var(--vch)}
.share{margin:14px auto 0;max-width:360px;text-align:left;display:flex;flex-direction:column;gap:6px}
.share .rowi{display:flex;gap:6px}
.fld{flex:1;min-width:0;font:inherit;color:var(--ink);background:var(--panel-2);border:2px solid var(--line);border-radius:6px;padding:8px;box-sizing:border-box}
.fld:focus-visible{outline:3px solid var(--gold);outline-offset:1px}
textarea.fld{width:100%;min-height:64px;resize:vertical}
.sendto{background:#06c755;color:#04210f;border-radius:6px;padding:8px 10px;font-family:var(--f-disp);font-size:15px;text-align:center;margin-top:4px}
.sendto b{font-weight:400;font-size:19px;margin:0 3px}
.codebox{background:var(--panel-2);border:2px dashed var(--gold);border-radius:6px;padding:8px;font-size:12px;word-break:break-all;user-select:all;color:var(--gold)}
table.rk{width:100%;border-collapse:collapse;font-size:13px}
table.rk th{font-weight:400;font-size:11px;color:var(--muted);text-align:left;padding:4px;letter-spacing:.06em}
table.rk td{padding:7px 4px;border-top:1px dotted var(--line);vertical-align:middle}
table.rk .no{font-family:var(--f-disp);width:2em;color:var(--muted)}
table.rk tr.top .no{color:var(--gold)}
table.rk .nm{word-break:break-all}
table.rk .n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
table.rk .sm{display:block;font-size:11px;color:var(--muted)}
table.rk .del{background:none;border:2px solid var(--line);border-radius:6px;padding:2px 7px;color:var(--muted)}
.rkwrap{overflow-x:auto}
.nbadge{display:inline-block;margin-left:6px;background:var(--mult);color:#fff;border-radius:99px;padding:0 6px;font-size:10px;font-family:var(--f-body);vertical-align:2px}
ul.news{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;font-size:13px}
ul.news li{display:flex;gap:4px;background:var(--panel-2);border-radius:6px;padding:7px 9px;line-height:1.5}
ul.news b{color:var(--gold);font-weight:400}
.nd{flex:none;color:var(--muted);font-size:11px;font-variant-numeric:tabular-nums;margin-right:6px}
.nup{background:var(--panel-2);border-radius:6px;padding:8px 10px;font-size:13px;margin-bottom:6px}
.nup b{font-family:var(--f-disp);font-weight:400}
.nup ul{margin:6px 0 0;padding-left:1.2em;line-height:1.6;color:#d9d0e2}

const foolNow=()=>{const l=G&&G.lastCons;return l?`<span class="foolnow">いま使うと: ${l.kind==='planet'?plart(l.hand):cart(l.id)}<b>${esc(l.kind==='planet'?HANDS[l.hand].p:TD[l.id].n)}</b>ができる</span>`:'<span class="foolnow none">いま使っても何もできない(まだタロットも惑星も使っていない)</span>'};
const livePack=()=>!!G.pack&&(G.pack.kind==='arc'||G.pack.kind==='spec');
const inRound=()=>((G.phase==='play'||livePack())&&G.hand.length>0)||'ラウンド中か、パックを開いているときに使ってください';
const rndEnh=()=>pick(Object.keys(ENH));
function giveCard(r,s,enh){const c=newCard(r,s,enh);G.deck.push(c);G.hand.push(c.u);return c}
const SL=[

 {id:'grim',n:'グリム',d:'手札のランダムな1枚を破壊し、強化されたA 2枚を手札に加える',k:0,need:inRound,use:()=>{destroyCard(pick(G.hand));for(let i=0;i<2;i++)giveCard(14,pick(SUITS),rndEnh());sortHand()}},

const b64e=t=>btoa(String.fromCharCode(...new TextEncoder().encode(t))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');

const decCard=t=>{const m=/^(\d{1,2})([SHCD])(\d)(\d)(\d)$/.exec(t);if(!m)return null;const r=+m[1];if(r<2||r>14)return null;return {r,s:m[2],enh:Object.keys(ENH)[m[3]-1]||null,seal:Object.keys(SEAL)[m[4]-1]||null,ed:EDS[m[5]-1]||null}};

function makeCode(name){

  return 'JS2.'+body+'.'+hsh(body);

function readCode(body,sum){
  if(hsh(body)!==sum)return null;
  try{
    const a=JSON.parse(b64d(body));
    if(!Array.isArray(a)||a.length<6)return null;
    const n=cleanName(a[0]),num=a.slice(1,6);
    if(!n||!num.every(x=>Number.isFinite(x)&&x>=0))return null;
    const e={n,p:Math.min(999,Math.floor(num[0])),b:Math.floor(num[1]),t:Math.min(CODE_ORDER.length-1,Math.floor(num[2])),r:Math.floor(num[3]),d:Math.floor(num[4])};
    if(typeof a[6]==='string'&&/^[a-z0-9:,]{1,2000}$/.test(a[6]))e.j=a[6];
    if(typeof a[7]==='string'&&/^[0-9SHCD,]{1,60}$/.test(a[7]))e.c=a[7];
    if(typeof a[8]==='string'&&/^[0-9a-eSHCD]{2,800}$/.test(a[8]))e.k=a[8];
    if(typeof a[9]==='string'&&DKD[a[9]])e.q=a[9];
    if(Number.isInteger(a[10])&&a[10]>=0&&a[10]<1e5)e.w=a[10];
    return e;
  }catch(e){return null}
}

 {id:'big',n:'大物ぞろい',d:'目標スコアが1.5倍'},
 {id:'hand',n:'狭い卓',d:'手札の枚数-1'},
 {id:'slot',n:'満席',d:'ジョーカー枠-1'},

function weekly(w){
  let x=(Math.imul(w+101,2654435761)^0x5a17)|0;
  const r=()=>{let t=x=(x+0x6D2B79F5)|0;t=Math.imul(t^t>>>15,t|1);t^=t+Math.imul(t^t>>>7,t|61);return ((t^t>>>14)>>>0)/4294967296};
  r();const js=JL.filter(j=>(j.r===2||j.r===3)&&!(j.wk>w));
  const deck=DECKS[Math.floor(r()*DECKS.length)].id;
  let rs=CRULES.filter(c=>!(c.id==='poor'&&deck==='green'));
  return {w,deck,joker:js[Math.floor(r()*js.length)].id,rule:rs[Math.floor(r()*rs.length)].id,seed:Math.floor(r()*4294967296)|0};
}

function sortHand(){
  if(G.sortBy==='manual'||(G.pack&&G.pack.manual))return;
  G.hand.sort((a,b)=>{const x=card(a),y=card(b);
    return G.sortBy==='rank'?(y.r-x.r)||(SUIT_ORD[x.s]-SUIT_ORD[y.s]):(SUIT_ORD[x.s]-SUIT_ORD[y.s])||(y.r-x.r)});
}
function drawCards(){while(G.hand.length<handSize()&&G.draw.length)G.hand.push(G.draw.pop());sortHand()}

function evalHand(cards){
  const n=cards.length,by={};
  cards.forEach(c=>(by[c.r]=by[c.r]||[]).push(c));
  const groups=Object.values(by).sort((a,b)=>b.length-a.length||b[0].r-a[0].r);
  let flush=false,straight=false;
  if(n===5){
    flush=SUITS.some(s=>cards.every(c=>hasSuit(c,s)));
    const rs=[...new Set(cards.map(c=>c.r))].sort((a,b)=>a-b);
    if(rs.length===5&&(rs[4]-rs[0]===4||rs.join()==='2,3,4,5,14'))straight=true;
  }
  const g0=groups[0]?.length||0,g1=groups[1]?.length||0;
  let type,sc;
  if(g0===5&&flush){type='f5';sc=cards}
  else if(g0===5){type='five';sc=cards}
  else if(straight&&flush){type='sf';sc=cards}
  else if(g0===4){type='four';sc=groups[0]}
  else if(g0===3&&g1>=2){type='full';sc=cards}
  else if(flush){type='flush';sc=cards}
  else if(straight){type='straight';sc=cards}
  else if(g0===3){type='three';sc=groups[0]}
  else if(g0===2&&g1===2){type='two';sc=[...groups[0],...groups[1]]}
  else if(g0===2){type='pair';sc=groups[0]}
  else{type='hc';sc=[cards.reduce((a,b)=>b.r>a.r?b:a)]}
  const set=new Set(sc);
  return {type,scoring:cards.filter(c=>set.has(c)),contains:{pair:g0>=2,three:g0>=3,four:g0>=4,two:(g0>=2&&g1>=2)||g0>=4,straight,flush}};
}

async function eff(el,r,el2){
  if(!r)return;
  let step=0;
  if(r.c){S.chips+=r.c;pop(el,'+'+fmt(r.c),'c');updCM('c');tick(++step);await wait(D())}
  if(r.m){S.mult+=r.m;pop(el,'+'+fmtM(r.m)+' 倍率','m');updCM('m');tick(++step);await wait(D())}
  if(r.x){S.mult*=r.x;pop(el,'×'+r.x+' 倍率','x');updCM('m');blip(520,.1,'sawtooth',.04);await wait(D())}
  if(r.$){G.money+=r.$;pop(el,'+$'+r.$,'d');renderMoney();blip(880,.08);await wait(D())}
  if(r.perm){r.perm.bonus=(r.perm.bonus||0)+5;pop(el,'アップグレード!','t');await wait(D()*.8)}
  if(el2)jig(el2);
}
let tickN=0;
function tick(){tickN++;blip(260*Math.pow(1.045,Math.min(tickN,40)),.06,'square',.035)}

async function playHand(){
  if(G.phase!=='play'||busy)return;
  const sel=G.hand.filter(u=>G.sel.includes(u));
  if(!sel.length)return;
  if(boss('psychic')&&sel.length<5){toast('ザ・サイキック: 5枚選んで出してください');return}
  busy=true;closePop();G.phase='scoring';tickN=0;
  G.hands--;
  G.hand=G.hand.filter(u=>!sel.includes(u));G.playing=sel;G.sel=[];
  const cards=sel.map(card), ev=evalHand(cards);
  let zero=false;
  if(boss('mouth')){if(G.mouth&&G.mouth!==ev.type)zero=true;else G.mouth=ev.type}
  if(boss('arm')&&G.levels[ev.type]>1){G.levels[ev.type]--;toast('ザ・アーム: '+HANDS[ev.type].n+'のレベルが下がった')}
  G.played[ev.type]++;G.lastType=ev.type;G.hn=(G.hn||0)+1;G.rt=G.rt||[];if(!G.rt.includes(ev.type))G.rt.push(ev.type);
  const held=G.hand.map(card);
  const ctx={type:ev.type,played:cards,scoring:ev.scoring,held,contains:ev.contains,firstFace:ev.scoring.find(c=>isFace(c)&&!debuffed(c))?.u};
  for(const j of G.jokers)JD[j.id].before?.(j,ctx);
  render();
  const scSet=new Set(ev.scoring.map(c=>c.u));
  let {c:ch,m:mu,lv}=handBase(ev.type);
  if(boss('flint')){ch=Math.max(1,Math.floor(ch/2));mu=Math.max(1,Math.floor(mu/2))}
  S={chips:ch,mult:mu};
  $('#handName').innerHTML=`${HANDS[ev.type].n}<small>Lv.${lv}</small>`;updCM('c');updCM('m');
  await wait(D());
  document.querySelectorAll('#playArea .card').forEach(el=>el.classList.add(scSet.has(+el.dataset.u)?'scoring':'dim'));
  await wait(D()*.6);
  if(zero){pop($('.handblk'),'ザ・マウス: スコアなし','dbf');S={chips:0,mult:0};updCM('c');updCM('m');await wait(D()*2)}
  else{
    for(const c of ev.scoring){
      const el=cEl(c.u);
      if(debuffed(c)){pop(el,'デバフ','dbf');await wait(D());continue}
      const reps=[null];
      if(c.seal==='red')reps.push('seal');
      for(const j of G.jokers){const t=res(j);const n=t&&JD[t.id].retrig?.(c,t,ctx)||0;for(let i=0;i<n;i++)reps.push(j)}
      for(const src of reps){
        if(src==='seal'){pop(el,'もう一度!','t');await wait(D()*.7)}
        else if(src){pop(jEl(src),'もう一度!','t');jig(jEl(src));await wait(D()*.7)}
        await eff(el,{c:baseChips(c)+(c.bonus||0)});
        if(c.enh==='bonus')await eff(el,{c:30});
        if(c.enh==='mult')await eff(el,{m:4});
        if(c.enh==='glass')await eff(el,{x:2});
        if(c.enh==='lucky'){if(rnd(5)===0)await eff(el,{m:20});if(rnd(15)===0)await eff(el,{$:20})}
        if(c.ed&&ED[c.ed].e)await eff(el,ED[c.ed].e);
        if(c.seal==='gold')await eff(el,{$:3});
        for(const j of [...G.jokers]){const t=res(j);if(!t)continue;const d=JD[t.id];if(d.card){const r=d.card(c,t,ctx);if(r)await eff(jEl(j),r,el)}}
      }
    }
    const mimes=G.jokers.filter(j=>res(j)?.id==='mime').length;
    for(const c of held){
      if(debuffed(c))continue;
      const el=cEl(c.u);
      const hasHeld=c.enh==='steel'||G.jokers.some(j=>{const t=res(j);return t&&JD[t.id].held?.(c,t,ctx)});
      if(!hasHeld)continue;
      for(let k=0;k<=mimes+(c.seal==='red'?1:0);k++){
        if(k>0){pop(el,'もう一度!','t');await wait(D()*.6)}
        if(c.enh==='steel')await eff(el,{x:1.5});
        for(const j of [...G.jokers]){const t=res(j);const r=t&&JD[t.id].held?.(c,t,ctx);if(r)await eff(jEl(j),r,el)}
      }
    }
    for(const j of [...G.jokers]){
      if(j.ed==='foil'||j.ed==='holo'){jig(jEl(j));await eff(jEl(j),ED[j.ed].e)}
      const t=res(j),d=t&&JD[t.id];
      if(d&&d.indep){for(let k=0,n=fujinN(j);k<=n;k++){const r=d.indep(t,ctx);if(!r)continue;if(k){pop(jEl(j),'もう一度!','t');await wait(D()*.6)}jig(jEl(j));await eff(jEl(j),r)}}
      if(j.ed==='poly'){jig(jEl(j));await eff(jEl(j),ED.poly.e)}
    }
  }
  if(!zero&&isDk('plasma')){const a=Math.floor((S.chips+S.mult)/2);S.chips=a;S.mult=a;pop($('.handblk'),'バランス!','t');updCM('c');updCM('m');blip(700,.12,'triangle');await wait(D())}
  const total=zero?0:Math.floor(S.chips*S.mult);
  if(total>G.stats.best){G.stats.best=total;G.stats.bestType=ev.type;G.stats.bestCards=cards.map(encCard).join(',')}
  await addScore(total);
  for(const j of [...G.jokers]){const m=JD[j.id].after?.(j,ctx);if(m)removeJoker(j,m)}
  for(const c of ev.scoring){if(c.enh==='glass'&&!debuffed(c)&&rnd(hasV('kintsugi')?8:4)===0){destroyCard(c.u);toast('ガラスカードが割れた!');blip(1200,.15,'triangle')}}
  if(boss('tooth')){G.money-=cards.length;toast('ザ・トゥース: -$'+cards.length)}
  await wait(D()*.8);
  G.playing=[];S={chips:0,mult:0};fire(false);
  busy=false;
  if(G.score>=target())winRound();
  else if(G.hands<=0)loseRound();
  else{
    if(boss('hook')&&G.hand.length){shuffle(G.hand).splice(0,2);toast('ザ・フック: 手札を2枚捨てた')}
    G.phase='play';drawCards();
  }
  save();render();stuckCheck();
}
function loseRound(){const ph=G.jokers.find(j=>j.id==='phoenix'&&!j.v);if(ph){ph.v=1;G.score=target();toast('フェニックスが灰の中からよみがえった!');blip(1320,.3,'triangle');winRound()}else gameOver()}
function isStuck(){return G.phase==='play'&&!livePack()&&!G.draw.length&&(!G.hand.length||(boss('psychic')&&G.hand.length<5))}
function stuckCheck(){
  if(busy||!isStuck())return false;
  toast(G.hand.length?'5枚出せるカードが残っていない…':'山札も手札も尽きた…');
  busy=true;
  setTimeout(()=>{busy=false;if(G.phase!=='play')return;loseRound();save();render()},1200);
  return true;
}
async function addScore(total){
  pop($('.handblk'),fmt(total),'big');blip(660,.2,'triangle',.06);
  const from=G.score,to=G.score+total,t0=performance.now(),dur=600/spd;
  G.score=to;

function discardSel(){
  if(G.phase!=='play'||busy||G.discards<=0)return;
  const sel=G.hand.filter(u=>G.sel.includes(u));if(!sel.length)return;
  G.discards--;const cs=sel.map(card);
  cs.forEach(c=>{if(c.seal==='purple'&&G.cons.length<maxC()){const id=pick(TL).id;G.cons.push({kind:'tarot',id});toast('パープルシール: '+TD[id].n+'を作った')}});
  for(const j of [...G.jokers]){const m=JD[j.id].discard?.(j,cs);if(m)removeJoker(j,m)}
  G.hand=G.hand.filter(u=>!sel.includes(u));G.sel=[];drawCards();blip(200,.08,'triangle');save();render();stuckCheck();
}
function winRound(){
  const rows=[],bi=G.blind;
  rows.push([(bi===2?bossDef().n:['小ブラインド','大ブラインド'][bi])+'を突破',reward(bi)]);
  const gd=isDk('green');
  if(G.hands>0)rows.push([`残りハンド ${G.hands}回 ($${gd?2:1}ずつ)`,G.hands*(gd?2:1)]);
  if(gd&&G.discards>0)rows.push([`残り捨て札 ${G.discards}回 ($1ずつ)`,G.discards]);
  if(bi===2&&isDk('anaglyph')){G.dbl=(G.dbl||0)+1;dexAdd('t','double');toast('アナグリフデッキ: ダブルタグを手に入れた')}
  const bk=vN('bottle','mybottle');
  if(bk&&G.discards>0)rows.push([`ボトルキープ 残り捨て札${G.discards}回 ($${bk}ずつ)`,bk*G.discards]);
  const gold=G.hand.map(card).filter(c=>c.enh==='gold'&&!debuffed(c)).length;
  if(gold)rows.push([`ゴールドカード ${gold}枚`,gold*3]);
  G.hand.map(card).forEach(c=>{if(c.seal==='blue'&&!debuffed(c)&&G.lastType&&G.cons.length<maxC()){G.cons.push({kind:'planet',hand:G.lastType});toast('ブルーシール: '+HANDS[G.lastType].p+'を作った')}});
  for(const j of [...G.jokers]){const r=JD[j.id].end?.(j);if(r){if(r.$)rows.push([JD[j.id].n,r.$]);if(r.destroy)removeJoker(j,r.destroy)}}
  const intr=gd||rule('poor')?0:clamp(Math.floor(G.money/5),0,intCap());
  if(intr)rows.push([`利子 ($5ごとに$1、最大$${intCap()})`,intr]);
  G.cash={rows,total:rows.reduce((a,r)=>a+r[1],0)};
  G.hand=[];G.draw=[];G.sel=[];

  if(r<20+wT)return {kind:'tarot',id:pick(TL).id,cost:3};
  if(r<20+wT+wP)return {kind:'planet',hand:pick(planetPool()),cost:3};

}
function genShop(){
  G.shop={items:[],packs:[],reroll:5};
  for(let i=0;i<shopSlots();i++)G.shop.items.push(genShopItem());
  for(let n=+G.rareFree||0;n>0;n--){const id=randJoker(3);G.shop.items.unshift({kind:'joker',id,cost:0})}
  G.rareFree=0;
  const ets=[...(G.edTags||[]),...(G.edTag?[G.edTag]:[]),...(G.negTag?['neg']:[])];
  G.edTags=[];G.edTag=null;G.negTag=false;
  for(const et of ets){const it=G.shop.items.find(i=>i.kind==='joker'&&!i.ed&&!i.neg);if(it){it.ed=et;it.neg=et==='neg';it.cost=0}else G.edTags.push(et)}
  if(has('zashiki')&&G.shop.items[0])G.shop.items[0].cost=0;
  G.shop.packs=Array.from({length:2+vN('fukubukuro')},pickPackKind).map(k=>({kind:k,cost:PACKS[k].c}));
  if(G.coupon){G.shop.items.forEach(i=>i.cost=0);G.shop.packs.forEach(p=>p.cost=0);G.coupon=false}

}
function reroll(){

  else{if(G.cons.length>=maxC())return toast('消費枠がいっぱいです');G.cons.push(it.kind==='planet'?{kind:'planet',hand:it.hand}:{kind:it.kind,id:it.id})}

function openPack(kind){
  if(G.pack){(G.packQ=G.packQ||[]).push(kind);return}
  let opts;

  else if(kind==='cel'){let hs=shuffle(planetPool());if(hasV('telescope')){const top=HAND_ORDER.reduce((a,k)=>G.played[k]>G.played[a]?k:a,'hc');hs=[top,...hs.filter(h=>h!==top)]}opts=hs.slice(0,3).map(h=>rand()<.003?{kind:'spectral',id:'blackhole'}:{kind:'planet',hand:h})}
  else if(kind==='spec'){opts=shuffle(SL.filter(x=>!x.rare)).slice(0,2).map(x=>{const r=rand();return {kind:'spectral',id:r<.01?'soul':r<.013?'blackhole':x.id}})}
  else if(kind==='arc'){opts=shuffle([...TL]).slice(0,3).map(t=>rand()<.01?{kind:'spectral',id:'soul'}:{kind:'tarot',id:t.id})}
  else{opts=[0,1,2].map(()=>{const c=newCard(2+rnd(13),pick(SUITS));if(rand()<.4)c.enh=pick(Object.keys(ENH));if(rand()<.2)c.seal=pick(Object.keys(SEAL));const q=rand();if(q<.08)c.ed=q<.012?'poly':q<.04?'holo':'foil';return {kind:'card',card:c}})}

function pickPack(i){

  else if(o.kind==='planet'){levelUp(o.hand);dexAdd('p',o.hand);G.lastCons={kind:'planet',hand:o.hand};toast(`${HANDS[o.hand].n} がレベル${G.levels[o.hand]}になった`)}

      if(t.exact?sel.length!==t.k:(sel.length<1||sel.length>t.k))return toast(`下の手札から、カードを${t.exact||t.k===1?t.k:'1〜'+t.k}枚選んでください`);
      const cs=sel.map(card);
      if(t.enh)cs.forEach(c=>c.enh=t.enh);
      else if(t.suit)cs.forEach(c=>c.s=t.suit);
      else t.use(cs);

      const ok=t.need?t.need():true;

function useCons(i){

  if(it.kind==='planet'){
    G.cons.splice(i,1);levelUp(it.hand);dexAdd('p',it.hand);G.lastCons={kind:'planet',hand:it.hand};

  }else{
    const t=TD[it.id];

      if(G.phase!=='play'&&!livePack())return toast('ラウンド中に手札のカードを選んでから使ってください');
      const sel=G.hand.filter(u=>G.sel.includes(u));
      if(t.exact?sel.length!==t.k:(sel.length<1||sel.length>t.k))return toast(`カードを${t.exact||t.k===1?t.k:'1〜'+t.k}枚選んでください`);

  closePop();blip(740,.12,'triangle');save();render();stuckCheck();
}

const fireCv=$('#fire'),fireCx=fireCv.getContext('2d');
let fireOn=false,fireK=0,fireH=null,fireRaf=0,fireT=0;
function fire(on,k=0){
  fireK=k;
  if(on===fireOn)return;
  fireOn=on;$('.cxm').classList.toggle('fire',on);
  if(!on)return;
  blip(120,.4,'sawtooth',.05);setTimeout(()=>blip(180,.3,'sawtooth',.04),80);

  const r=fireCv.getBoundingClientRect(),W=Math.max(8,Math.round(r.width/3)),H=Math.max(6,Math.round(r.height/3));
  fireCv.width=W;fireCv.height=H;fireH=new Float32Array(W*(H+2));

}
function fireCheck(){
  const t=target(),v=G.score+Math.floor(S.chips*S.mult);
  if(G.phase==='scoring'&&v>=t)fire(true,clamp(Math.log10(v/t)/2,0,1));else fire(false);

function fireLoop(ts){
  fireRaf=0;if(!fireH)return;
  if(ts-fireT>55){
    fireT=ts;
    const W=fireCv.width,H=fireCv.height,h=fireH,cr=fireCv.getBoundingClientRect(),xr=$('.cxm .x').getBoundingClientRect();
    const gl=(xr.left-cr.left)/cr.width*W-1,gr=(xr.right-cr.left)/cr.width*W;
    for(let x=0;x<W;x++){const v=fireOn&&(x<gl||x>gr)?.3+Math.random()*.7:0;h[H*W+x]=v;h[(H+1)*W+x]=v}
    const cool=.064-.03*fireK,img=fireCx.createImageData(W,H);let any=false;
    for(let y=0;y<H;y++)for(let x=0;x<W;x++){
      const b=(y+1)*W,v=Math.max(0,(h[b+Math.max(0,x-1)]+h[b+x]+h[b+Math.min(W-1,x+1)]+h[b+W+x])/4-Math.random()*cool*2);
      h[y*W+x]=v;
      if(v>.1){
        any=true;
        const red=x>(gl+gr)/2,c=v>.72?(red?[255,236,170]:[223,244,255]):v>.48?(red?[255,170,60]:[111,177,255]):v>.27?(red?[232,71,58]:[45,134,232]):(red?[138,28,44]:[27,79,156]),i=(y*W+x)*4;
        img.data[i]=c[0];img.data[i+1]=c[1];img.data[i+2]=c[2];img.data[i+3]=255;
      }
    }
    fireCx.putImageData(img,0,0);
    if(!fireOn&&!any){fireH=null;return}
  }
  fireRaf=requestAnimationFrame(fireLoop);
}

      case 'cha':cheat('a',a.dataset.n);break;
      case 'chj':cheat('j',a.dataset.id);break;
      case 'restart':showMenu(true);break;
      case 'howto':showTitle();break;
      case 'rules':showRules();mbox.scrollTop=0;break;
      case 'closem':closeModal();break;
      case 'speed':spd=spd===1?2:spd===2?4:1;a.textContent='速度 '+spd+'×';break;
      case 'sound':soundOn=!(soundOn&&volLv>0);if(soundOn&&!volLv)volLv=5;volSave();soundBtn();if($('#vol')){$('#vol').value=volLv;$('#volV').textContent=soundOn?volLv:'OFF'}blip(660,.09,'triangle');break;
    }
    return;
  }
  const c=t.closest('#handArea .card');
  if(c&&(G.phase==='play'||livePack())&&!busy){
    const u=+c.dataset.u;
    if(G.sel.includes(u))G.sel=G.sel.filter(x=>x!==u);
    else if(G.sel.length<5)G.sel.push(u);
    else{toast('選べるのは5枚までです');return}
    blip(G.sel.includes(u)?480:360,.04,'square',.03);
    renderSide();renderStage();
    return;
  }
  const jk=t.closest('.jk[data-ji]');if(jk){openJokerPop(+jk.dataset.ji);return}
  const cn=t.closest('.jk[data-ci]');if(cn){openConsPop(+cn.dataset.ci);return}
});
document.addEventListener('keydown',e=>{
  if((e.key==='Enter'||e.key===' ')&&e.target.matches('.card,.jk')){e.preventDefault();e.target.click()}
  if(e.key==='Enter'&&e.target.id==='pname'){e.preventDefault();mkCode()}
  if(e.key==='Escape'){closePop();if(G&&!modal.hidden)closeModal()}
  if(e.shiftKey&&(e.key==='ArrowLeft'||e.key==='ArrowRight')&&G&&!busy&&e.target.matches('#jokers .jk[data-ji]')){
    e.preventDefault();
    const i=+e.target.dataset.ji,k=i+(e.key==='ArrowLeft'?-1:1);
    if(k<0||k>=G.jokers.length)return;
    [G.jokers[i],G.jokers[k]]=[G.jokers[k],G.jokers[i]];closePop();save();renderTop();document.querySelector(`.jk[data-ji="${k}"]`)?.focus();
    return;
  }
  if(e.shiftKey&&(e.key==='ArrowLeft'||e.key==='ArrowRight')&&G&&(G.phase==='play'||livePack())&&!busy&&e.target.matches('#handArea .card')){
    e.preventDefault();
    const u=+e.target.dataset.u,i=G.hand.indexOf(u),k=i+(e.key==='ArrowLeft'?-1:1);
    if(i<0||k<0||k>=G.hand.length)return;
    [G.hand[i],G.hand[k]]=[G.hand[k],G.hand[i]];if(livePack())G.pack.manual=true;else G.sortBy='manual';save();renderStage();cEl(u)?.focus();
  }
});

/* ---------- hand reorder (drag) ---------- */
let drag=null,noClick=0;
document.addEventListener('pointerdown',e=>{
  if(e.button>0||!G||busy)return;
  const jk=e.target.closest('#jokers .jk[data-ji]');
  const el=jk||(G.phase==='play'||livePack()?e.target.closest('#handArea .card'):null);if(!el)return;
  const els=jk?[...el.parentNode.querySelectorAll('.jk[data-ji]')]:[...el.parentNode.children],i=els.indexOf(el);
  const step=els.length>1?els[1].offsetLeft-els[0].offsetLeft:el.offsetWidth;
  drag={id:e.pointerId,el,els,i,to:i,x:e.clientX,y:e.clientY,step,on:false,jk:!!jk,touch:e.pointerType!=='mouse'};
});
document.addEventListener('pointermove',e=>{
  if(!drag||e.pointerId!==drag.id)return;
  const n=drag.els.length;
  if(drag.pan){const se=document.scrollingElement;if(se)se.scrollTop-=e.clientY-drag.y;drag.y=e.clientY;return}
  const dx=clamp(e.clientX-drag.x,-drag.i*drag.step-12,(n-1-drag.i)*drag.step+12);
  if(!drag.on){
    if(drag.jk&&drag.touch){const rx=Math.abs(e.clientX-drag.x),ry=Math.abs(e.clientY-drag.y);if(ry>12&&ry>rx*2){drag.pan=true;drag.y=e.clientY;return}}
    if(Math.abs(dx)<(drag.jk?5:8))return;
    drag.on=true;closePop();drag.el.classList.add('drag');
    if(drag.jk&&drag.touch)drag.el.style.setProperty('--lift','-30%');
  }
  const to=clamp(Math.round(drag.i+dx/drag.step),0,n-1);
  if(to!==drag.to&&drag.jk)blip(540,.025,'square',.02);
  drag.to=to;
  drag.el.style.setProperty('--dx',dx+'px');
  drag.els.forEach((c,k)=>{
    if(c===drag.el)return;
    const sh=drag.i<k&&k<=drag.to?-drag.step:drag.to<=k&&k<drag.i?drag.step:0;
    c.style.setProperty('--dx',sh+'px');
  });
});
function endDrag(e,commit){
  if(!drag||e.pointerId!==drag.id)return;
  const d=drag;drag=null;
  if(d.pan){noClick=1;setTimeout(()=>{noClick=0},40);return}
  if(!d.on)return;
  noClick=1;setTimeout(()=>{noClick=0},40);
  if(d.jk){
    if(commit&&d.to!==d.i&&!busy){const [j]=G.jokers.splice(d.i,1);G.jokers.splice(d.to,0,j);blip(420,.04,'square',.03);save()}
    renderTop();return;
  }
  if(commit&&d.to!==d.i&&(G.phase==='play'||livePack())&&!busy){
    const [u]=G.hand.splice(d.i,1);G.hand.splice(d.to,0,u);
    if(livePack())G.pack.manual=true;else G.sortBy='manual';blip(420,.04,'square',.03);save();
  }
  renderStage();
}
document.addEventListener('pointerup',e=>endDrag(e,true));
document.addEventListener('pointercancel',e=>endDrag(e,false));
document.addEventListener('contextmenu',e=>{if(e.target.closest?.('#jokers .jk[data-ji]'))e.preventDefault()});
addEventListener('resize',()=>{layoutRows();closePop()});

/* ---------- persistence ---------- */
function save(){dexScan();try{lastSave=JSON.stringify(G);localStorage.setItem(curKey(),lastSave);localStorage.setItem(SLOTKEY,G.ch!=null?'c':'n')}catch(e){}runMark(curKey())}
/* run cloud save: keeps the in-progress run on the player's account so it survives app restarts and device changes */
const RUNTS='joker-sakaba-runts';let runRef=null,runT=0,runBusy=false,runAgain=false,runDirty=false;
function runTs(){try{const t=JSON.parse(localStorage.getItem(RUNTS)||'{}');return t&&typeof t==='object'?t:{}}catch(e){return {}}}
function runMark(k){const t=runTs();t[k]=Date.now();try{localStorage.setItem(RUNTS,JSON.stringify(t))}catch(e){}runDirty=true;clearTimeout(runT);runT=setTimeout(runPush,1200)}
function runDel(k){try{localStorage.removeItem(k)}catch(e){}runMark(k)}
function runBody(){const t=runTs(),g=k=>{try{return localStorage.getItem(k)}catch(e){return null}};let sl='n';try{sl=localStorage.getItem(SLOTKEY)||'n'}catch(e){}
  return {v1:g(KEY),ch:g(CHKEY),tv1:t[KEY]||0,tch:t[CHKEY]||0,slot:sl}}
async function runPush(){clearTimeout(runT);if(!runRef||!runDirty)return;if(runBusy){runAgain=true;return}runBusy=true;runDirty=false
  try{await runRef.set(runBody())}catch(e){if(e&&(e.code==='not_granted'||e.code==='invalid_argument'||e.code==='quota_exceeded'))runRef=null;else runDirty=true}
  runBusy=false;if(runAgain){runAgain=false;runPush()}}
addEventListener('pagehide',()=>runPush());
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden')runPush()});
async function runSync(){try{
  const c=window.claude;if(!c||!c.use)return;
  const [db,u]=await Promise.all([c.use('db'),c.use('user')]);if(!db||!u)return;
  const id=await u.id();if(!id)return;
  const ref=db.doc('data/users/'+id+'/run');const snap=await ref.get();
  const t=runTs();let got=null,changed=false;
  if(snap.exists){const d=snap.data()||{};
    for(const [k,f,tf] of [[KEY,'v1','tv1'],[CHKEY,'ch','tch']]){
      const ct=+d[tf]||0;if(ct<=(t[k]||0))continue;
      try{if(typeof d[f]==='string'&&d[f])localStorage.setItem(k,d[f]);else localStorage.removeItem(k)}catch(e){continue}
      t[k]=ct;changed=true;if(!got||ct>got.t)got={k,t:ct}}
    if(changed){try{localStorage.setItem(RUNTS,JSON.stringify(t));if(d.slot==='c'||d.slot==='n')localStorage.setItem(SLOTKEY,d.slot)}catch(e){}}}
  runRef=ref;
  if(changed&&!busy&&G){
    const k=atHome?(d=>d==='c'?CHKEY:KEY)((()=>{try{return localStorage.getItem(SLOTKEY)}catch(e){return 'n'}})()):curKey();
    if(t[k]&&got&&(atHome||k===got.k)){let s=null;try{s=localStorage.getItem(k)}catch(e){}if(s&&load(s)){lastSave=s;closePop();render()}}
    if(atHome&&!modal.hidden&&mbox.querySelector('.title'))showTitle();
    toast('アカウントに保存されたランを読み込みました');
  }
  if(!snap.exists||Object.values(runTs()).some(v=>v>(snap.exists?Math.max(+snap.data().tv1||0,+snap.data().tch||0):0))){runDirty=true;runPush()}
}catch(e){}}
function openSlot(key){
  let s=null;try{s=localStorage.getItem(key)}catch(e){}
  if(!s||!load(s))return false;
  try{localStorage.setItem(SLOTKEY,key===CHKEY?'c':'n')}catch(e){}
  lastSave=s;lastCode='';closePop();fire(false);render();return true;
}
window.claude?.hot?.snapshot?.(()=>({G:lastSave}));
function load(s){
  try{const g=JSON.parse(s);if(!g||!g.deck)return false;G=g;if(G.phase==='scoring')G.phase='play';if(!G.vouchers)G.vouchers=[];if(livePack()&&!G.hand.length)dealPackHand();HAND_ORDER.forEach(k=>{if(G.levels[k]==null)G.levels[k]=1;if(G.played[k]==null)G.played[k]=0});if(!('vch' in G))G.vch=pickVoucher();if(G.phase==='play'&&!livePack())drawCards();return true}catch(e){return false}
}

/* ---------- background ---------- */
(function bg(){
  const cv=$('#bg'),ctx=cv.getContext('2d'),W=96,H=60;cv.width=W;cv.height=H;
  const img=ctx.createImageData(W,H);
  const pal=[[9,30,28],[16,50,45],[24,66,58],[44,28,52],[62,24,48]];
  const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
  function draw(t){
    for(let y=0;y<H;y++)for(let x=0;x<W;x++){
      const u=x/W-.5,v=(y/H-.5)*.62,a=Math.atan2(v,u),r=Math.hypot(u,v);
      const s=Math.sin(a*3+r*14-t*.35)+.6*Math.sin(u*7+t*.22)+.5*Math.cos(v*9-t*.17);
      const k=clamp(Math.floor((s+2.1)/4.2*pal.length),0,pal.length-1);
      const c=pal[k],i=(y*W+x)*4;img.data[i]=c[0];img.data[i+1]=c[1];img.data[i+2]=c[2];img.data[i+3]=255;
    }
    ctx.putImageData(img,0,0);
  }
  if(reduce){draw(0);return}
  let last=0;(function loop(ts){if(ts-last>70){draw(ts/1000);last=ts}requestAnimationFrame(loop)})(0);
})();

/* ---------- boot ---------- */
function start(data){
  let ok=false;
  if(data&&data.G)ok=load(data.G);
  if(!ok){
    let slot='n';try{slot=localStorage.getItem(SLOTKEY)||'n'}catch(e){}
    for(const k of slot==='c'?[CHKEY,KEY]:[KEY,CHKEY]){
      let s=null;try{s=localStorage.getItem(k)}catch(e){}
      if(s&&load(s)){ok=true;if(k===KEY&&G.ch!=null){runDel(KEY);save()}break}
    }
  }
  if(!ok)newGame();
  G.jokers.forEach(j=>dexAdd('j',j.id));G.vouchers.forEach(v=>dexAdd('v',v));dexScan();if(inBoss())dexAdd('b',G.boss);
  lastSave=JSON.stringify(G);
  render();
  let back='';try{back=sessionStorage.getItem('joker-sakaba-rank')||'';sessionStorage.removeItem('joker-sakaba-rank')}catch(e){}
  if(back){atHome=back==='h';regMsg='';showRank()}
  else if(!(data&&data.G))showTitle();
}
window.claude?.hot?.ready?window.claude.hot.ready(start):start(window.claude?.hot?.data??{});
runSync();
})();
</script>
